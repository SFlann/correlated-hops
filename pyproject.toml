[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "correlated-hops"
version = "0.1.0"
description = "Local hierarchies of pure states for communicating Gaussian environments"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Stuart Flannigan"}]
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[project.optional-dependencies]
plot = ["matplotlib>=3.7"]
test = ["pytest>=7"]
dev = ["build>=1.2", "ruff>=0.9"]

[project.urls]
Repository = "https://github.com/SFlann/correlated-hops"
Documentation = "https://github.com/SFlann/correlated-hops#readme"
Issues = "https://github.com/SFlann/correlated-hops/issues"

[tool.setuptools.packages.find]
where = ["python/src"]

[tool.pytest.ini_options]
testpaths = ["python/tests"]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
